<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <main class="container py-5 text-center">
        <h1 class="mb-4">Intrusive Flavors Recipe Box</h1>

    <section class="mb-5">
        <h2>Find a recipe</h2>
        <input type="number" id ="recipe-id">
        <button id ="get-btn" class= btn btn-dark">Get Recipe</button>
        <p id="status"></p>
        <div id="recipe"></div>
    </section>

    <section class="mb-5">
        <h2>Add a dish</h2>
        <input type="text" id="dish-name" placeholder="New Dish Name">
        <button id="post-btn" class="btn btn-warning">Add Dish</button>
        <p id="post-status"></p>
        <div id="saved"></div>
    </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
